
[setting]
; Disbable GPU acceleration.
hardware-acceleration=0

[Proxy]
; TODO(xushaohua): Set its default value.
default-key="null"

[Update]
; TODO(xushaohua): Add comments.
Install=1

[Skins]
; Use style/skin/default skin packet.
current-skin="default"

[UIDesktopLyrics]
; Display DesktopLyrics window at (300, 300) at the first time.
window-position=@Point(300 300)

[UIMiniPlayer]
; Dsiplays MiniPLayer window at (200, 200) at the first time.
window-position=@Point(200 200)

[ServiceStorage]
; Default cache capacity is 1G.
cache-capacity=1

