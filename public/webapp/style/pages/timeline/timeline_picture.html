<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>PC动态图片展开</title>
<!-- STYLE -->
<link rel="stylesheet" href="../../css/animate.ls.css"/>
<link rel="stylesheet" href="../../css/base.ls.css"/>
<link rel="stylesheet" href="../../css/grid.ls.css"/>
<link rel="stylesheet" href="../../css/unit.ls.css"/>
<link rel="stylesheet" href="../../css/module.ls.css"/>
<link rel="stylesheet" href="../../css/frame.ls.css">
<link rel="stylesheet" href="../../css/layer.ls.css">
<link rel="stylesheet" href="../../css/style.ls.css">
<link rel="stylesheet" href="../../css/skin_common.ls.css">

<!-- SKIN -->
<link rel="stylesheet" href="../../skin/pub/web/css/skin.ls.css">

<style>
body{overflow-y:auto;border:0;}
</style>
<script src="../replace.js"></script>
</head>
<body>
<div class="g-bdm">
    <div class="g-bdmc">
        <div class="g-wrap">
        	<!-- 动态列表 -->
        	<div class="m-timeline">
        		<div class="head f-cb">
        			<h2 class="f-ff2 f-fl">动态</h2>
        		</div>
        		<!-- 列表 -->
        		<ul class="m-dlist">
                    <!-- 分享类型 -->
        			<li class="itm">
                        <div class="gface">
                            <a href="#" class="u-face u-face-1"><img src="http://p3.music.126.net/TQUugjXM5p8AoatC8i5bhw==/2884019000801825.jpg?param=180y180"></a>
                        </div>
                        <div class="gcnt">
                            <!-- 用户名，动态类型 -->
                            <div class="type f-fs1 f-pr">
                                <a href="#" class="s-fc2">小贴贴七夏_杀老师白脸豆眼萌呆</a><span class="sep s-fc3">分享了电台</span>
                            </div>
                            <!-- 发布时间 -->
                            <div class="time s-fc4">5分钟前</div>
                            <!-- 发布文字 -->
                            <div class="text f-brk">
                                阳光、沙滩、比基尼，今年的夏天，让我们体验夏日的热情！时隔两年，SNH48终于再次推出全新的夏季EP《盛夏好声音》
                            </div>
                            <!-- 单曲 -->
                            <div class="src f-cb">
                                <div class="cover u-cover u-cover-tn u-cover-ply">
                                    <span class="lnk"><img src="http://p4.music.126.net/EPuVx0Cr-r4rFxaIvivSGw==/1704243023060641.jpg?param=130y130"></span>
                                    <span class="ply u-dicn u-dicn-8"></span>
                                </div>
                                <div class="scnt s-fc3">
                                    <h3 class="tit f-thide"><a href="#" class="s-fc3">As Long As You Love Me</a></h3>
                                    <h4 class="from f-thide s-fc4"><a href="#" class="s-fc3">Backstreet Boys</a></h4>
                                </div>
                            </div>
                            <!-- 配图 -->
                            <ul class="pics f-cb">
                                    <li class="pic"></li>
                                    <li class="pic pic-loading"></li>
                                    <li class="pic"><img class="f-img f-curbig" src="http://imgsize.ph.126.net?imgurl=http://imghttp:.ph.126.net//img2.ph.126.net/TkKX3ehWkteEv9eXMOidRw==/3360529747048984808.jpg_140x140x1.jpg"></li>
                                </ul>
                            <!-- 展开大图 -->
                            <div class="showpic">
                                <!-- 收起，查看原图，下载 -->
                                <div class="btns">
                                    <a href="#" class="btn s-fc3"><svg><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="../../res/svg/icon.sp.svg#img_fold"></use></svg> 收起</a><span class="line"></span>
                                    <a href="#" class="btn s-fc3"><svg><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="../../res/svg/icon.sp.svg#img_full"></use></svg> 查看原图</a><span class="line"></span>
                                    <a href="#" class="btn s-fc3"><svg><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="../../res/svg/icon.sp.svg#img_download"></use></svg> 下载</a><span class="line"></span>                                 
                                </div>
                                <!-- 图片切换 -->
                                <div class="slide slide-loading f-pr">
                                    <div class="wrap"><img src="http://img2.ph.126.net/_k3XeEsFXrNmSvByAB4omA==/2266717987551550001.jpg" alt="" class="thepic f-cursml" style="width:;"></div>
                                    <span class="turn f-curleft"></span>
                                    <span class="turn turn-right f-curright"></span>
                                </div>
                                <!-- 页码 -->
                                <div class="pages">
                                    <span class="pg"></span>
                                    <span class="pg z-curr"></span>
                                    <span class="pg"></span>
                                    <span class="pg"></span>
                                </div>
                            </div>
                            <br><br>
                            <!-- 展开大图 -->
                            <div class="showpic">
                                <!-- 收起，查看原图，下载 -->
                                <div class="btns">
                                    <a href="#" class="btn s-fc3"><svg><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="../../res/svg/icon.sp.svg#img_fold"></use></svg> 收起</a><span class="line"></span>
                                    <a href="#" class="btn s-fc3"><svg><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="../../res/svg/icon.sp.svg#img_full"></use></svg> 查看原图</a><span class="line"></span>
                                    <a href="#" class="btn s-fc3"><svg><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="../../res/svg/icon.sp.svg#img_download"></use></svg> 下载</a><span class="line"></span>                                 
                                </div>
                                <!-- 图片切换 -->
                                <div class="slide slide-loading f-pr">
                                    <div class="wrap"><img src="http://img.hb.aicdn.com/bf688c33a9efb2ea202f6dfae0845bc5166f88e19a81e-M5JW1q_fw658" alt="" class="thepic f-cursml"></div>
                                    <span class="turn f-curleft"></span>
                                    <span class="turn turn-right f-curright"></span>
                                </div>
                                <!-- 页码 -->
                                <div class="pages">
                                    <span class="pg"></span>
                                    <span class="pg z-curr"></span>
                                    <span class="pg"></span>
                                    <span class="pg"></span>
                                </div>
                            </div>
                            <br><br>
                            <!-- 转发展开大图 -->
                            <div class="card card-pic">
                                <div class="showpic">
                                    <!-- 收起，查看原图，下载 -->
                                    <div class="btns">
                                        <a href="#" class="btn s-fc3"><svg><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="../../res/svg/icon.sp.svg#img_fold"></use></svg> 收起</a><span class="line"></span>
                                        <a href="#" class="btn s-fc3"><svg><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="../../res/svg/icon.sp.svg#img_full"></use></svg> 查看原图</a><span class="line"></span>
                                        <a href="#" class="btn s-fc3"><svg><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="../../res/svg/icon.sp.svg#img_download"></use></svg> 下载</a><span class="line"></span>                                 
                                    </div>
                                    <!-- 图片切换 如果图片的height<260px, margin-top = (260-height)/2     -->
                                    <div class="slide f-pr">
                                        <div class="wrap"><img src="http://img2.ph.126.net/_k3XeEsFXrNmSvByAB4omA==/2266717987551550001.jpg" alt="" class="thepic f-cursml" style="width:300px; margin-top:30px;"></div>
                                        <span class="turn f-curleft"></span>
                                        <span class="turn turn-right f-curright"></span>
                                    </div>
                                    <!-- 页码 -->
                                    <div class="pages">
                                        <span class="pg"></span>
                                        <span class="pg z-curr"></span>
                                        <span class="pg"></span>
                                        <span class="pg"></span>
                                    </div>
                                </div>
                            </div>
                            <!-- 动态操作bar -->
                            <div class="doper">
                                <span class="btn f-cp"><svg><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="../../res/svg/icon.sp.svg#cmt_like"></use></svg> (7)</span><span class="line">|</span>
                                <span class="btn f-cp"><svg><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="../../res/svg/icon.sp.svg#timeline_forward"></use></svg> (100)</span><span class="line">|</span>
                                <span class="btn f-cp"><svg><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="../../res/svg/icon.sp.svg#timeline_cmt"></use></svg> (1)</span>
                            </div>
                        </div>
        			</li>
        		</ul>
        	</div>
        	<!-- 动态列表 End -->

            <!-- /End -->
        </div>   
    </div>
</div>
</body>
</html>
