<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>PC查看大图</title>
<!-- STYLE -->
<link rel="stylesheet" href="../../css/animate.ls.css"/>
<link rel="stylesheet" href="../../css/base.ls.css"/>
<link rel="stylesheet" href="../../css/grid.ls.css"/>
<link rel="stylesheet" href="../../css/unit.ls.css"/>
<link rel="stylesheet" href="../../css/module.ls.css"/>
<link rel="stylesheet" href="../../css/frame.ls.css">
<link rel="stylesheet" href="../../css/layer.ls.css">
<link rel="stylesheet" href="../../css/style.ls.css">
<link rel="stylesheet" href="../../css/skin_common.ls.css">

<!-- SKIN -->
<link rel="stylesheet" href="../../skin/pub/web/css/skin.ls.css">

<style>
body{overflow-y:auto;border:0;}
</style>
<script src="../replace.js"></script>
</head>
<body>
<!-- 查看原图 全屏 -->
<div class="m-timelineslide z-show" style="display:;">
    <div class="mask f-alpha"></div>
    <div class="picbody">
        <div class="fail"></div>
        <div class="picwrap">
            <table>
                <tbody>
                <tr>
                    <td class="f-pr">
                        <img class="f-curleft" data-action="mouse" src="http://nej.netease.com/images/publisher_setting_sample.jpg">
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <a class="picprev pictool"><svg><use xlink:href="../../res/svg/icon.sp.svg#img_page"></use></svg></a>
    <a class="picnext pictool"><svg><use xlink:href="../../res/svg/icon.sp.svg#img_page"></use></svg></a>
    <div class="tool">
      <span class="pages">3/4</span>|
      <button class="dld f-alpha f-pa" title="下载原图"><svg><use xlink:href="../../res/svg/icon.sp.svg#img_full_download"></use></svg></button>
    </div>
    <a class="icn cls f-pa" title="关闭"><svg><use xlink:href="../../res/svg/icon.sp.svg#close_l"></use></svg></a>
</div>
</body>
</html>
