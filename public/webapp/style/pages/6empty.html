<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Modules网易云音乐</title>
<!-- STYLE -->
<link rel="stylesheet" href="../css/animate.ls.css"/>
<link rel="stylesheet" href="../css/base.ls.css"/>
<link rel="stylesheet" href="../css/grid.ls.css"/>
<link rel="stylesheet" href="../css/unit.ls.css"/>
<link rel="stylesheet" href="../css/module.ls.css"/>
<link rel="stylesheet" href="../css/layer.ls.css">
<link rel="stylesheet" href="../css/style.ls.css">
<link rel="stylesheet" href="../css/skin_common.ls.css">
<!-- SKIN -->
<!--
<link rel="stylesheet" href="../skin/black/web/css/skin.ls.css">
<link rel="stylesheet" href="../skin/black/web/css/skin_theme.ls.css">
 -->
<link rel="stylesheet" href="../skin/pub/web/css/skin.ls.css">
<link rel="stylesheet" href="../skin/red/web/css/skin_theme.ls.css">
<style>
body{overflow-y:auto;border:0;}
h1{font-size:30px; margin:20px 0; font-weight:bold; text-align:center;}
.whitebg{margin:10px 0;padding:10px; background:#eeeff2; text-shadow:0 1px rgba(255,255,255,0.5);color:#333;}
.whitebg h1{ color:#333; }
.g-bd{position:static;min-height:0;padding:30px;}
.m-layer.z-show,.m-menu,.m-dragmdl{position:relative;top:auto;left:auto;}
.m-dragmdl{margin:20px;}
</style>
<script src="replace.js"></script>
</head>
<body>
<h1>无内容时</h1>
<div class="m-empty m-empty-5">
	<h2 class="s-fc1">你还没有收藏任何节目！</h2>
	<p class="s-fc4">去<a href="#" class="f-tdu s-fc3">大牌DJ</a>选择我们为你精心推荐的节目</p>
</div>
<div class="m-empty">
	<h2 class="s-fc1">赶快去收藏你喜欢的音乐</h2>
	<p class="s-fc4">将音乐拖动到左边列表中<em class="s-fc3">“那些好听的电视剧歌曲”</em>来加入音乐，<br>或者点击 <span class="u-icn u-icn-fav"><svg><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="../res/svg/icon.sp.svg#btn_fav"></use></svg></span>，将音乐加入歌单！</p>
</div>
<div class="m-empty">
	<div class="emptywrap">
		<h2 class="s-fc1">赶快去收藏你喜欢的音乐</h2>
		<p class="s-fc4">将音乐拖动到左边列表中<em class="s-fc3">“那些好听的电视剧歌曲”</em>来加入音乐，<br>或者点击 <span class="u-icn u-icn-fav"><svg><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="../res/svg/icon.sp.svg#btn_fav"></use></svg></span>，将音乐加入歌单！</p>
	</div>
</div>
<div class="m-empty m-empty-2">
	<div class="emptywrap">
		<h2 class="s-fc1">你还没有添加任何歌曲！</h2>
		<p class="s-fc4">去首页<a href="#" class="f-tdu s-fc3">发现音乐</a><br>或在<a href="#" class="f-tdu s-fc3">我的音乐</a>收听自己收藏的歌单</p>
	</div>
</div>
<div class="m-empty m-empty-4">
	<p class="s-fc4">还没有评论哦，快来抢沙发~</p>
</div>
<!-- 404页面 -->
<div class="m-404">
	<span class="icon u-icn u-icn-content s-fc4"><svg><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="../res/svg/icon.sp.svg#empty_content"></use></svg></span>
	<h2 class="s-fc1">很抱歉，内容已经不存在！</h2>
</div>
<!-- 无网络 -->
<div class="m-off">
	<i class="icon u-icn u-icn-offline s-fc7"><svg><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="../res/svg/icon.sp.svg#empty_offline"></use></svg></i>
	<h2 class="s-fc3">网络不给力哦，请检查你的网络设置~</h2>
</div>
<div class="m-off">
	<i class="icon u-icn u-icn-download-empty s-fc7"><svg><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="../res/svg/icon.sp.svg#empty_dld"></use></svg></i>
	<h2 class="s-fc3">还没有下载的音乐哦，赶快去下载吧~</h2>
</div>




</body>
</html>
