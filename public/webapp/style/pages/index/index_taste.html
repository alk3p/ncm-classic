<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>开启个性化推荐-网易云音乐</title>
<!-- STYLE -->
<link rel="stylesheet" href="../../css/animate.ls.css"/>
<link rel="stylesheet" href="../../css/base.ls.css"/>
<link rel="stylesheet" href="../../css/grid.ls.css"/>
<link rel="stylesheet" href="../../css/unit.ls.css"/>

<body>

<!-- 开启个性化推荐 -->
<div class="m-layer-taste-full z-show">
    <!-- 关闭按钮，和框架上的关闭按钮位置相同 -->
    <a class="icn cls"><svg><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="../../res/svg/icon.sp.svg#close_l"></use></svg></a>
    <section class="m-tastelay" style="height: 509px;">
        <div class="wrap z-ani">
            <h2 class="title f-ff2">选择你感兴趣的音乐标签</h2>
            <ul class="m-taglist">
                <li>华语</li>
                <li class="z-sel">欧美</li>
                <li>日语</li>
                <li>韩语</li>
            </ul>
            <ul class="m-taglist">
                <li>电音</li>
                <li>纯音乐</li>
                <li class="z-sel">动漫</li>
                <li>民谣</li>
                <li>摇滚</li>
                <li>说唱</li>
                <li>爵士</li>
                <li>舞曲</li>
                <li class="z-sel">影视原声</li>
                <li>古典</li>
                <li>古风</li>
                <li>流行</li>
            </ul>
            <ul class="m-taglist blk">
                <li class="z-sel">我偏向流行音乐</li>
                <li>我偏向小众音乐</li>
            </ul>
            <a href="#" class="u-tag-indark u-tag-indark-hl finish">完&nbsp;&nbsp;&nbsp;成</a>
            <p class="warn z-show">请至少选择1个标签</p>
        </div>
    </section>
</div>
<div class="m-mask m-mask-3"></div>
</body>
